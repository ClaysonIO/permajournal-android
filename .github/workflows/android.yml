name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Client ID of a GitHub OAuth App with Device Flow enabled (Settings → Variables).
          VITE_GITHUB_CLIENT_ID: ${{ vars.PERMAJOURNAL_OAUTH_CLIENT_ID }}
      - run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: permajournal-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
